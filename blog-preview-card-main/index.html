<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background-color: #f7d426;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      margin: auto;
      max-height: 400px;
      width: 280px;
      background-color: white;
      border: 1px solid black;
      padding: 15px;
      border-radius: 13px;
      margin-top: 70px;
      margin-bottom: 65px;
      padding-left: 15px;
     
      line-height: 1.6;
      box-shadow: 6px 6px black;
      
    }
    .img {
      margin: auto;
      height: 35%;
      width: 100%;
      border-radius: 10px;
    }
    .img img {
      height: 100%;
      width: 100%;
      border-radius: 15px;
    }
    h3 {
      background-color: #f7d426;
      width: 80px;
      border-radius: 5px;
      padding-left:13px ;
      margin-top: 10px;
      font-size: smaller;
      font-weight:bolder;
    }
    .boldtext {
      font-size: smaller;
      padding-top: 12px;
    }
    .card h2 {
      padding-top: 12px ;
      font-size: medium;
      font-weight:bolder ;
      color: #121212;
    }
    #smallsize {
      font-size: small;
      padding-top: 13px;
      color: #12121299;
    }
    #myphoto {
      display: flex;
      height: 40px;
      padding-top: 15px;
      

    }
    #myphoto p {
      font-size:smaller;
      font-weight: bolder;
      padding-left: 10px;
    
    }

    
  .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  
  /* Mobile Responsive Styles - Added without touching your existing code */
  @media screen and (max-width: 375px) {
    body {
      padding: 15px;
    }
    
    .card {
      width: 100%;
      max-width: 280px;
      margin-top: 20px;
      margin-bottom: 20px;
    }
    
    .card h2 {
      font-size: 15px;
    }
    
    #smallsize {
      font-size: 12px;
    }
    
    .attribution {
      font-size: 10px;
      padding: 0 10px;
    }
  }
  
  /* For very small devices */
  @media screen and (max-width: 280px) {
    .card {
      padding: 10px;
    }
    
    h3 {
      width: 70px;
      padding-left: 8px;
      font-size: 10px;
    }
    
    .card h2 {
      font-size: 14px;
    }
    
    #myphoto p {
      font-size: 11px;
    }
  }
  
  
  </style>
</head>
<body>

  <div class="card">
    <div class="img">
    <img src="assets/images/img.svg" alt="can't find image">
      </div>
      
 <h3>
  Learning
 </h3>

 <p class="boldtext" >
    Published 21 Dec 2023
 </p>



<h2> 
  HTML & CSS foundations  
</h2>

<p id="smallsize" >
    These languages are the backbone of every website, defining structure, content, and presentation.

</p>
<div id="myphoto" >
    <img src="assets/images/photo.webp" alt=""> 
    <p>Greg Hooper</p>

</div>  
 
  </div>

  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Sami</a>.
  </div>
</body>
</html>
