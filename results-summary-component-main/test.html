<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result Summary Component</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hanken Grotesk', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ecf2ff;
            padding: 20px;
        }

        .container {
            max-width: 750px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 30px 60px rgba(61, 108, 236, 0.15);
            overflow: hidden;
        }

        .result-card {
            display: flex;
            flex-direction: column;
        }

        /* بخش نتیجه (آبی) */
        .result-section {
            background: linear-gradient(180deg, #7755FF 0%, #6943FF 0.01%, #2F2CE9 100%);
            padding: 40px 30px;
            text-align: center;
            border-radius: 0 0 32px 32px;
            color: white;
        }

        .result-title {
            color: #CAC9FF;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 24px;
        }

        .circle-score {
            background: linear-gradient(180deg, #4D21C9 0%, #2521C9 100%);
            width: 140px;
            height: 140px;
            border-radius: 50%;
            margin: 0 auto 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .big-score {
            font-size: 56px;
            font-weight: 800;
            line-height: 1;
            color: white;
        }

        .total-score {
            color: #CAC9FF;
            font-size: 16px;
            font-weight: 700;
            opacity: 0.5;
        }

        .result-grade {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: white;
        }

        .result-description {
            color: #CAC9FF;
            font-size: 16px;
            font-weight: 500;
            max-width: 260px;
            margin: 0 auto;
        }

        /* بخش خلاصه (سفید) */
        .summary-section {
            padding: 30px;
            background: white;
        }

        .summary-title {
            color: #303B59;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .summary-items {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px;
            border-radius: 12px;
        }

        .item-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .item-icon {
            width: 20px;
            height: 20px;
        }

        .item-name {
            font-size: 16px;
            font-weight: 500;
        }

        .item-score {
            font-weight: 700;
            color: #303B59;
        }

        .item-score span {
            color: #A0A5B2;
            margin-left: 8px;
            font-weight: 500;
        }

        /* رنگ‌بندی آیتم‌ها */
        .item-reaction {
            background: linear-gradient(0deg, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.95)), #FF5555;
            background-blend-mode: overlay, normal;
        }
        .item-reaction .item-name {
            color: #D84C4C;
        }

        .item-memory {
            background: linear-gradient(0deg, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.95)), #FFB21E;
            background-blend-mode: overlay, normal;
        }
        .item-memory .item-name {
            color: #D48D2B;
        }

        .item-verbal {
            background: linear-gradient(0deg, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.95)), #00BB8F;
            background-blend-mode: overlay, normal;
        }
        .item-verbal .item-name {
            color: #249E7C;
        }

        .item-visual {
            background: linear-gradient(0deg, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.95)), #1125D6;
            background-blend-mode: overlay, normal;
        }
        .item-visual .item-name {
            color: #2535B0;
        }

        .continue-btn {
            width: 100%;
            padding: 18px;
            background: #303B59;
            color: white;
            border: none;
            border-radius: 128px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .continue-btn:hover {
            background: linear-gradient(180deg, #7755FF 0%, #6943FF 0.01%, #2F2CE9 100%);
        }

        /* دسکتاپ - کارت‌ها کنار هم */
        @media screen and (min-width: 768px) {
            .container {
                border-radius: 32px;
            }

            .result-card {
                flex-direction: row;
            }

            .result-section {
                flex: 1;
                border-radius: 32px;
                padding: 40px 30px;
            }

            .summary-section {
                flex: 1;
                padding: 40px 30px;
            }

            .circle-score {
                width: 200px;
                height: 200px;
            }

            .big-score {
                font-size: 72px;
            }

            .result-grade {
                font-size: 32px;
            }

            .result-description {
                font-size: 18px;
                max-width: 220px;
            }

            .summary-title {
                font-size: 24px;
            }

            .summary-items {
                gap: 18px;
            }
        }

        /* انیمیشن‌ها */
        .summary-item {
            transition: transform 0.3s ease;
        }

        .summary-item:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 10px rgba(0,0,0,0.1);
        }

        .continue-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="result-card">
            <!-- بخش نتیجه (سمت چپ/بالا) -->
            <div class="result-section">
                <h2 class="result-title">Your Result</h2>
                <div class="circle-score">
                    <span class="big-score">76</span>
                    <span class="total-score">of 100</span>
                </div>
                <h3 class="result-grade">Great</h3>
                <p class="result-description">
                    You scored higher than 65% of the people who have taken these tests.
                </p>
            </div>

            <!-- بخش خلاصه (سمت راست/پایین) -->
            <div class="summary-section">
                <h2 class="summary-title">Summary</h2>
                
                <div class="summary-items">
                    <!-- Reaction -->
                    <div class="summary-item item-reaction">
                        <div class="item-left">
                            <svg class="item-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 20 20">
                                <path stroke="#D84C4C" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10 5.833v5m0 3.334h.008M18.333 10a8.333 8.333 0 1 1-16.667 0 8.333 8.333 0 0 1 16.667 0Z"/>
                            </svg>
                            <span class="item-name">Reaction</span>
                        </div>
                        <div class="item-score">
                            80 <span>/ 100</span>
                        </div>
                    </div>

                    <!-- Memory -->
                    <div class="summary-item item-memory">
                        <div class="item-left">
                            <svg class="item-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 20 20">
                                <path stroke="#D48D2B" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5.833 5.833 10 2.5l4.167 3.333v5.834L10 15l-4.167-3.333V5.833Z"/>
                                <path stroke="#D48D2B" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.5 12.5v3.333L10 20l7.5-4.167V12.5M10 10.833v6.667"/>
                            </svg>
                            <span class="item-name">Memory</span>
                        </div>
                        <div class="item-score">
                            92 <span>/ 100</span>
                        </div>
                    </div>

                    <!-- Verbal -->
                    <div class="summary-item item-verbal">
                        <div class="item-left">
                            <svg class="item-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 20 20">
                                <path stroke="#249E7C" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10 5.833v8.334M5.833 10h8.334M18.333 10a8.333 8.333 0 1 1-16.667 0 8.333 8.333 0 0 1 16.667 0Z"/>
                            </svg>
                            <span class="item-name">Verbal</span>
                        </div>
                        <div class="item-score">
                            61 <span>/ 100</span>
                        </div>
                    </div>

                    <!-- Visual -->
                    <div class="summary-item item-visual">
                        <div class="item-left">
                            <svg class="item-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 20 20">
                                <path stroke="#2535B0" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.5 7.5v8.333L10 20l7.5-4.167V7.5L10 2.5 2.5 7.5Z"/>
                                <path stroke="#2535B0" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10 10.833 2.5 7.5l7.5-4.167L17.5 7.5l-7.5 3.333Zm0 0V20"/>
                            </svg>
                            <span class="item-name">Visual</span>
                        </div>
                        <div class="item-score">
                            73 <span>/ 100</span>
                        </div>
                    </div>
                </div>

                <button class="continue-btn">Continue</button>
            </div>
        </div>
    </div>
</body>
</html>
