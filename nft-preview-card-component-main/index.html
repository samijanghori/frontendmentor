<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NFT Card</title>
<link rel="stylesheet" href="style.css">
<style>
  *{
margin:0;
padding:0;
box-sizing:border-box;
font-family: sans-serif;
}

body{
background:hsl(217, 54%, 11%);
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.container{
background:hsl(216, 50%, 16%);
width:300px;
padding:20px;
border-radius:15px;
box-shadow:0 20px 40px rgba(0,0,0,0.4);
}

.image{
position:relative;
cursor:pointer;
}

.main-img{
width:100%;
border-radius:10px;
display:block;
}

.overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,255,247,0.5);
display:flex;
align-items:center;
justify-content:center;
opacity:0;
border-radius:10px;
transition:0.3s;
}

.image:hover .overlay{
opacity:1;
}

h1{
color:white;
font-size:20px;
margin-top:20px;
cursor:pointer;
}

h1:hover{
color:hsl(178, 100%, 50%);
}

p{
color:hsl(215, 51%, 70%);
margin-top:15px;
font-size:14px;
line-height:1.5;
}

.info{
display:flex;
justify-content:space-between;
margin-top:20px;
}

.eth{
color:hsl(178, 100%, 50%);
display:flex;
align-items:center;
gap:6px;
font-weight:bold;
}

.time{
color:hsl(215, 51%, 70%);
display:flex;
align-items:center;
gap:6px;
}

hr{
margin-top:20px;
border:none;
border-top:1px solid hsl(215, 32%, 27%);
}

.creator{
display:flex;
align-items:center;
gap:10px;
margin-top:15px;
}

.creator img{
width:30px;
border:1px solid white;
border-radius:50%;
}

.creator p{
font-size:14px;
}

.creator span{
color:white;
cursor:pointer;
}

.creator span:hover{
color:hsl(178, 100%, 50%);
}
</style>
</head>

<body>

<div class="container">

<div class="image">
<img class="main-img" src="images/image-equilibrium.jpg" alt="">
<div class="overlay">
<img src="images/icon-view.svg" alt="">
</div>
</div>

<h1>Equilibrium #3429</h1>

<p>
Our Equilibrium collection promotes balance and calm.
</p>

<div class="info">

<div class="eth">
<img src="images/icon-ethereum.svg" alt="">
<span>0.041 ETH</span>
</div>

<div class="time">
<img src="images/icon-clock.svg" alt="">
<span>3 days left</span>
</div>

</div>

<hr>

<div class="creator">
<img src="images/image-avatar.png" alt="">
<p>Creation of <span>Jules Wyvern</span></p>
</div>

</div>

</body>
</html>
